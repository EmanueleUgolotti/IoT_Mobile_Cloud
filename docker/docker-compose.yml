services:
  api:
    build:
      context: ../backend/api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bpa
      DB_USER: bpa
      DB_PASSWORD: bpa
      AUTH_ENABLED: "false"
      API_KEY: "changeme"
      DATASET_PATH: /data/dataset
      CAPTURED_IMAGES_PATH: /data/captured
    volumes:
      - ../data/dataset:/data/dataset:ro
      - ../data/captured:/data/captured
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpa
      POSTGRES_USER: bpa
      POSTGRES_PASSWORD: bpa
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

volumes:
  db_data: